name: SEC-1 production signing bootstrap

on:
  push:
    paths:
      - ".github/runner-smoke.trigger"

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check cryptography==44.0.1 PyNaCl==1.5.0 requests==2.32.3

      - name: Generate and provision production Ed25519 signing key
        shell: python
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.DC_CONTROL_PLANE_BOOTSTRAP_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          import base64, hashlib, os, sys, requests
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from nacl.public import PublicKey, SealedBox

          API = "https://api.github.com"
          repo = os.environ.get("REPOSITORY", "").strip()
          token = os.environ.get("BOOTSTRAP_TOKEN", "").strip()
          if not token or not repo:
              print("FAIL: bootstrap token or repository identity missing")
              sys.exit(2)

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def req(method, path, expected, payload=None):
              r = requests.request(method, API + path, headers=headers, json=payload, timeout=30)
              if r.status_code not in expected:
                  print(f"FAIL: {method} {path} -> {r.status_code}")
                  sys.exit(3)
              return r

          def absent(path, label):
              r = requests.get(API + path, headers=headers, timeout=30)
              if r.status_code == 200:
                  print(f"REFUSED: {label} already exists")
                  sys.exit(4)
              if r.status_code != 404:
                  print(f"FAIL: preflight {label} -> {r.status_code}")
                  sys.exit(5)

          private_path = f"/repos/{repo}/actions/secrets/DIGITALCROWN_LICENSE_SIGNING_PRIVATE_KEY_B64URL"
          kid_path = f"/repos/{repo}/actions/variables/DIGITALCROWN_LICENSE_SIGNING_KEY_ID"
          public_path = f"/repos/{repo}/actions/variables/DIGITALCROWN_LICENSE_SIGNING_PUBLIC_KEY_B64URL"
          absent(private_path, "production private signing secret")
          absent(kid_path, "production signing key id")
          absent(public_path, "production public signing key")

          private_key = Ed25519PrivateKey.generate()
          private_raw = private_key.private_bytes(serialization.Encoding.Raw, serialization.PrivateFormat.Raw, serialization.NoEncryption())
          public_raw = private_key.public_key().public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw)
          if len(private_raw) != 32 or len(public_raw) != 32:
              print("FAIL: malformed Ed25519 raw key length")
              sys.exit(6)

          probe = b"digital-crown-sec1-production-key-bootstrap-v2"
          signature = private_key.sign(probe)
          private_key.public_key().verify(signature, probe)

          b64u = lambda b: base64.urlsafe_b64encode(b).decode("ascii").rstrip("=")
          private_value = b64u(private_raw)
          public_value = b64u(public_raw)
          kid = "dc-prod-" + hashlib.sha256(public_raw).hexdigest()[:16]

          repo_key = req("GET", f"/repos/{repo}/actions/secrets/public-key", {200}).json()
          encrypted = base64.b64encode(SealedBox(PublicKey(base64.b64decode(repo_key["key"]))).encrypt(private_value.encode())).decode()

          req("PUT", private_path, {201}, {"encrypted_value": encrypted, "key_id": repo_key["key_id"]})
          req("POST", f"/repos/{repo}/actions/variables", {201}, {"name": "DIGITALCROWN_LICENSE_SIGNING_KEY_ID", "value": kid})
          req("POST", f"/repos/{repo}/actions/variables", {201}, {"name": "DIGITALCROWN_LICENSE_SIGNING_PUBLIC_KEY_B64URL", "value": public_value})

          if req("GET", private_path, {200}).json().get("name") != "DIGITALCROWN_LICENSE_SIGNING_PRIVATE_KEY_B64URL":
              print("FAIL: private secret readback metadata mismatch")
              sys.exit(7)
          if req("GET", kid_path, {200}).json().get("value") != kid:
              print("FAIL: kid readback mismatch")
              sys.exit(8)
          if req("GET", public_path, {200}).json().get("value") != public_value:
              print("FAIL: public key readback mismatch")
              sys.exit(9)

          req("DELETE", f"/repos/{repo}/actions/secrets/DC_CONTROL_PLANE_BOOTSTRAP_TOKEN", {204})

          print("PASS: production Ed25519 keypair generated and self-tested")
          print("PASS: private key encrypted into GitHub Actions Secrets")
          print("PASS: bootstrap token removed")
          print(f"DIGITALCROWN_LICENSE_SIGNING_KEY_ID={kid}")
          print(f"DIGITALCROWN_LICENSE_SIGNING_PUBLIC_KEY_B64URL={public_value}")
          print("Private signing key was never printed or artifacted")
