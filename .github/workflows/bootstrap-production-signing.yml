name: Bootstrap production signing key

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PROVISION to create the production Ed25519 key"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/provision.trigger"

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm explicit production provisioning
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "PROVISION" || {
            echo "FAIL: confirmation must be exactly PROVISION"
            exit 2
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned crypto/API dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          cryptography==44.0.1 PyNaCl==1.5.0 requests==2.32.3

      - name: Generate, verify and store production signing material
        shell: python
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.DC_CONTROL_PLANE_BOOTSTRAP_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          import base64
          import hashlib
          import os
          import sys

          import requests
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from nacl.public import PublicKey, SealedBox

          API = "https://api.github.com"
          API_VERSION = "2022-11-28"
          token = os.environ.get("BOOTSTRAP_TOKEN", "").strip()
          repo = os.environ.get("REPOSITORY", "").strip()
          if not token or not repo or "/" not in repo:
              print("FAIL: bootstrap token or repository identity is missing.")
              sys.exit(3)

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": API_VERSION,
          }

          def request(method, path, *, expected, payload=None):
              response = requests.request(
                  method,
                  f"{API}{path}",
                  headers=headers,
                  json=payload,
                  timeout=30,
              )
              if response.status_code not in expected:
                  print(f"FAIL: GitHub API {method} {path} returned {response.status_code}.")
                  sys.exit(4)
              return response

          def require_absent(path, label):
              response = requests.get(f"{API}{path}", headers=headers, timeout=30)
              if response.status_code == 200:
                  print(f"REFUSED: {label} already exists. Key rotation requires a separate reviewed procedure.")
                  sys.exit(5)
              if response.status_code != 404:
                  print(f"FAIL: preflight for {label} returned {response.status_code}.")
                  sys.exit(6)

          require_absent(
              f"/repos/{repo}/actions/secrets/DIGITALCROWN_LICENSE_SIGNING_PRIVATE_KEY_B64URL",
              "production private signing secret",
          )
          require_absent(
              f"/repos/{repo}/actions/variables/DIGITALCROWN_LICENSE_SIGNING_KEY_ID",
              "production signing key id",
          )
          require_absent(
              f"/repos/{repo}/actions/variables/DIGITALCROWN_LICENSE_SIGNING_PUBLIC_KEY_B64URL",
              "production public signing key",
          )

          def b64url(data: bytes) -> str:
              return base64.urlsafe_b64encode(data).decode("ascii").rstrip("=")

          private_key = Ed25519PrivateKey.generate()
          private_raw = private_key.private_bytes(
              encoding=serialization.Encoding.Raw,
              format=serialization.PrivateFormat.Raw,
              encryption_algorithm=serialization.NoEncryption(),
          )
          public_raw = private_key.public_key().public_bytes(
              encoding=serialization.Encoding.Raw,
              format=serialization.PublicFormat.Raw,
          )
          if len(private_raw) != 32 or len(public_raw) != 32:
              print("FAIL: generated Ed25519 raw keys are not 32 bytes.")
              sys.exit(7)

          probe = b"digital-crown-sec1-production-key-bootstrap-v1"
          signature = private_key.sign(probe)
          private_key.public_key().verify(signature, probe)

          private_value = b64url(private_raw)
          public_value = b64url(public_raw)
          kid = "dc-prod-" + hashlib.sha256(public_raw).hexdigest()[:16]

          key_response = request(
              "GET",
              f"/repos/{repo}/actions/secrets/public-key",
              expected={200},
          ).json()
          repo_public_key = PublicKey(base64.b64decode(key_response["key"]))
          encrypted_private = base64.b64encode(
              SealedBox(repo_public_key).encrypt(private_value.encode("utf-8"))
          ).decode("ascii")

          request(
              "PUT",
              f"/repos/{repo}/actions/secrets/DIGITALCROWN_LICENSE_SIGNING_PRIVATE_KEY_B64URL",
              expected={201},
              payload={
                  "encrypted_value": encrypted_private,
                  "key_id": key_response["key_id"],
              },
          )
          request(
              "POST",
              f"/repos/{repo}/actions/variables",
              expected={201},
              payload={"name": "DIGITALCROWN_LICENSE_SIGNING_KEY_ID", "value": kid},
          )
          request(
              "POST",
              f"/repos/{repo}/actions/variables",
              expected={201},
              payload={
                  "name": "DIGITALCROWN_LICENSE_SIGNING_PUBLIC_KEY_B64URL",
                  "value": public_value,
              },
          )

          secret_meta = request(
              "GET",
              f"/repos/{repo}/actions/secrets/DIGITALCROWN_LICENSE_SIGNING_PRIVATE_KEY_B64URL",
              expected={200},
          ).json()
          kid_meta = request(
              "GET",
              f"/repos/{repo}/actions/variables/DIGITALCROWN_LICENSE_SIGNING_KEY_ID",
              expected={200},
          ).json()
          public_meta = request(
              "GET",
              f"/repos/{repo}/actions/variables/DIGITALCROWN_LICENSE_SIGNING_PUBLIC_KEY_B64URL",
              expected={200},
          ).json()

          if secret_meta.get("name") != "DIGITALCROWN_LICENSE_SIGNING_PRIVATE_KEY_B64URL":
              print("FAIL: private signing secret metadata readback mismatch.")
              sys.exit(8)
          if kid_meta.get("value") != kid or public_meta.get("value") != public_value:
              print("FAIL: public signing metadata readback mismatch.")
              sys.exit(9)

          request(
              "DELETE",
              f"/repos/{repo}/actions/secrets/DC_CONTROL_PLANE_BOOTSTRAP_TOKEN",
              expected={204},
          )

          print("PASS: production Ed25519 keypair generated and self-tested.")
          print("PASS: private key encrypted directly into GitHub Actions Secrets.")
          print("PASS: bootstrap token removed from repository secrets.")
          print(f"DIGITALCROWN_LICENSE_SIGNING_KEY_ID={kid}")
          print(f"DIGITALCROWN_LICENSE_SIGNING_PUBLIC_KEY_B64URL={public_value}")
          print("Private signing key value was never printed or stored as an artifact.")
